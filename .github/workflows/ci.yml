name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Build without Supabase credentials: env is validated lazily at request
      # time, so CI never needs real secrets.
      - run: pnpm build

  # Runs the RLS suite on the same Postgres image as production
  # (TURKSTILHOUSE-CORE: supabase/postgres 17.6.1.166), with Supabase's real
  # roles and auth.uid(). Throwaway container; no production access or secrets.
  rls-supabase:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.166
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve database role
        env:
          PGPASSWORD: postgres
        run: |
          for user in postgres supabase_admin; do
            if psql -h localhost -U "$user" -d postgres -v ON_ERROR_STOP=1 -c \
              "select version(), current_user, r.rolsuper, r.rolbypassrls
                 from pg_roles r where r.rolname = current_user;
               select to_regnamespace('auth') is not null as has_auth,
                      to_regprocedure('auth.uid()') is not null as has_auth_uid;"; then
              echo "RLS_TEST_DATABASE_URL=postgresql://$user:postgres@localhost:5432/postgres" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No usable database role" >&2
          exit 1
      - run: pnpm vitest run supabase
